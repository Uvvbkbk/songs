<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌える曲リスト</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eef2f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="歌单">
<style>
  html { scrollbar-gutter: stable; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #eef2f9; min-height: 100vh; padding: 1rem;
    color: #2d3e5c; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .app { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; }

  /* ============ 顶栏 ============ */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.85rem; flex-wrap: wrap; gap: 0.6rem;
  }
  .topbar h1 {
    font-size: 1.15rem; font-weight: 700; color: #3b5578;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .topbar-avatar {
    width: 34px; height: 34px; flex: 0 0 34px;
    border: 2px solid #ffffff; border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 2px #9bb5dc, 0 2px 6px rgba(59,85,120,0.2);
  }
  .topbar-right { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .stats {
    background: #dde6f2; color: #4a6a94;
    padding: 0.3rem 0.85rem; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600;
  }
  .mode-badge {
    padding: 0.3rem 0.75rem; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.3px;
  }
  .mode-badge.guest { background: #e8f0e8; color: #4a8a5a; }
  .mode-badge.admin { background: #fdeaea; color: #c05050; }

  .btn {
    padding: 0 0.85rem; height: 30px; border-radius: 8px; border: none;
    font-size: 0.78rem; font-weight: 600; cursor: pointer;
    transition: 0.15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-family: inherit;
  }
  .btn-secondary {
    background: #ffffff; color: #4a6a94; border: 1px solid #cdd9ea;
  }
  .btn-secondary:hover { background: #e8eff9; border-color: #a9bcd6; }
  .btn-primary { background: #6c8fc7; color: #fff; }
  .btn-primary:hover { background: #5a7db5; }
  .btn-sm { height: 26px; padding: 0 0.7rem; font-size: 0.72rem; }

  /* ============ 表单面板 ============ */
  .form-panel {
    background: #ffffff; border-radius: 14px;
    padding: 0.85rem 1rem; margin-bottom: 0.9rem;
    border: 1px solid #dde6f2;
    box-shadow: 0 2px 8px rgba(108,143,199,0.06);
    display: none;
  }
  .form-panel.show { display: block; }
  .form-panel.show { position: relative; z-index: 20; }
  .form-panel h2 {
    font-size: 0.82rem; color: #4a6a94; margin-bottom: 0.6rem;
    font-weight: 700; display: flex; align-items: center; gap: 0.4rem;
  }
  .form-panel h2 .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6c8fc7;
  }
  .form-row {
    display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end;
  }
  .form-group {
    flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 0.25rem;
    position: relative;
  }
  .form-group.title { flex: 2; min-width: 180px; }
  .form-group label {
    font-size: 0.7rem; color: #7a8ba8; font-weight: 600;
  }
  .input-wrapper { position: relative; display: flex; align-items: center; }
  .form-group input {
    padding: 0 0.75rem; height: 34px;
    border: 1px solid #cdd9ea; border-radius: 8px;
    font-size: 0.85rem; background: #fafbfe; outline: none;
    transition: all 0.15s; color: #2d3e5c; font-family: inherit;
    width: 100%; padding-right: 2rem;
  }
  .form-group input:focus {
    border-color: #6c8fc7; background: #fff;
    box-shadow: 0 0 0 3px rgba(108,143,199,0.12);
  }
  .form-group input.duplicate {
    border-color: #d05252 !important;
    background: #fdeaea !important;
    box-shadow: 0 0 0 3px rgba(208,82,82,0.12) !important;
  }
  .form-group input::placeholder { color: #a9b8ce; }
  
  /* 快捷下拉按钮 */
  .dropdown-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 6px;
    background: #eef2f9; color: #6c8fc7; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; transition: 0.15s;
  }
  .dropdown-btn:hover { background: #dde6f2; color: #4a6a94; }
  
  /* 快捷选择面板 */
  .quick-panel {
    position: absolute; top: 100%; left: 0; right: 0;
    background: #fff; border: 1px solid #cdd9ea; border-radius: 8px;
    box-shadow: 0 10px 25px rgba(59,85,120,0.15);
    z-index: 30; max-height: 200px; overflow-y: auto;
    margin-top: 4px; display: none; flex-wrap: wrap; gap: 4px; padding: 6px;
  }
  .quick-panel.show { display: flex; }
  .quick-item {
    background: #eef2f9; color: #4a6a94; padding: 0.25rem 0.6rem;
    border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    transition: background 0.1s;
  }
  .quick-item:hover { background: #dde6f2; }

  .form-buttons { display: flex; gap: 0.4rem; align-items: center; height: 34px; }
  .btn-form {
    height: 34px; padding: 0 1.1rem;
    border-radius: 8px; border: none;
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: 0.15s; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-form.btn-secondary {
    border: 1px solid #cdd9ea;
  }

  /* ============ 搜索行 ============ */
  .search-row {
    display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: center;
  }
  .search-box {
    flex: 1; display: flex; align-items: center;
    background: #ffffff; border-radius: 10px;
    padding: 0 0.85rem; border: 1px solid #dde6f2;
    height: 36px;
    box-shadow: 0 2px 8px rgba(108,143,199,0.04);
  }
  .search-box input {
    flex: 1; border: none; font-size: 0.85rem;
    background: transparent; outline: none; color: #2d3e5c;
    height: 100%; font-family: inherit;
  }
  .search-box input::placeholder { color: #a9b8ce; }
  .random-btn {
    height: 36px; padding: 0 1rem;
    border-radius: 10px; border: none;
    background: linear-gradient(135deg, #8ba9d4, #6c8fc7);
    color: #ffffff; font-size: 0.82rem; font-weight: 700;
    cursor: pointer; transition: 0.15s;
    display: inline-flex; align-items: center; gap: 0.35rem;
    box-shadow: 0 3px 10px rgba(108,143,199,0.3);
    font-family: inherit; white-space: nowrap;
  }
  .random-btn:hover { transform: translateY(-1px); }
  .go-fab {
    position: fixed; right: calc(1.25rem + env(safe-area-inset-right, 0px));
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); z-index: 950;
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; padding: 0; border: none; border-radius: 50%;
    background: linear-gradient(135deg, #8ba9d4, #6c8fc7); color: #fff;
    font: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(108,143,199,0.4);
    transition: background-color 160ms ease, box-shadow 160ms ease, transform 140ms ease;
  }
  .go-fab:hover { transform: translateY(-2px); }
  .go-fab:focus-visible { outline: 3px solid #4a6a94; outline-offset: 3px; }
  .go-fab:active { transform: scale(0.96); }

  /* ============ 标签筛选 ============ */
  .tag-filter-row {
    display: flex; gap: 0.35rem;
    margin-bottom: 0.9rem; align-items: flex-start;
  }
  .tag-filter-row:empty { display: none; }
  .tag-filter-items {
    display: flex; flex: 1 1 auto; flex-wrap: wrap; align-content: flex-start;
    gap: 0.35rem; min-width: 0; max-height: 1.8rem; overflow: hidden;
    transition: max-height 220ms ease;
  }
  .tag-filter-toggle {
    flex: 0 0 auto; white-space: nowrap;
  }
  .tag-filter-toggle[hidden] { display: none; }
  .tag-filter {
    background: #ffffff; color: #6c8fc7;
    border: 1px solid #cdd9ea;
    padding: 0.2rem 0.75rem; border-radius: 20px;
    font-size: 0.73rem; font-weight: 600;
    cursor: pointer; transition: 0.12s;
    font-family: inherit; user-select: none;
  }
  .tag-filter:hover { background: #e8eff9; border-color: #a9bcd6; }
  .tag-filter.active {
    background: #6c8fc7; color: #ffffff; border-color: #6c8fc7;
    box-shadow: 0 2px 8px rgba(108,143,199,0.35);
  }
  .tag-filter .count { opacity: 0.65; font-size: 0.66rem; margin-left: 0.2rem; }
  
  /* 编辑标签按钮 */
  .edit-tag-btn {
    background: #fff4e5; color: #d87e36; border-color: #f5d5b3;
    margin-right: 0.2rem;
  }
  .edit-tag-btn:hover { background: #ffeacc; border-color: #eac19c; }
  .edit-tag-btn.editing {
    background: #d87e36; color: #fff; border-color: #d87e36;
  }
  .edit-tag-btn.editing:hover { background: #c9712b; }

  /* 标签编辑模式 */
  .tag-edit-wrapper { display: flex; align-items: center; gap: 0.3rem; }
  .tag-edit-input {
    width: 80px; padding: 0.15rem 0.4rem;
    border: 1px solid #a9bcd6; border-radius: 20px;
    font-size: 0.73rem; outline: none; color: #2d3e5c;
  }
  .tag-edit-input:focus { border-color: #6c8fc7; box-shadow: 0 0 0 2px rgba(108,143,199,0.2); }
  .tag-save-btn {
    background: #6c8fc7; color: white; border: none;
    padding: 0; border-radius: 50%;
    font-size: 0.65rem; cursor: pointer;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .tag-save-btn:hover { background: #5a7db5; }

  /* ============ 分类瀑布流排版 ============ */
  .categories-container {
    column-count: 2;
    column-gap: 1.1rem;
    align-items: start;
  }
  @media (max-width: 940px) {
    .categories-container { column-count: 1; }
  }

  .category-card {
    position: relative;
    background: #ffffff; border-radius: 16px;
    padding: 1.1rem 1.3rem 0.9rem 1.3rem;
    box-shadow: 0 2px 0 #d9e3f0, 0 4px 12px rgba(108,143,199,0.07);
    border: 2px dashed #c6d5e9;
    break-inside: avoid;
    display: inline-block; width: 100%;
    margin-bottom: 1.1rem;
  }
  .sakura-layer {
    position: fixed; inset: 0; z-index: 900; overflow: hidden;
    pointer-events: none; perspective: 900px;
    color: var(--theme-primary-light);
  }
  .sakura-petal {
    position: absolute; top: -12%; left: var(--petal-left); width: 12px; height: 22px;
    opacity: 0.68;
    animation: sakura-fall var(--sakura-duration, 17s) linear var(--fall-delay, 0s) infinite;
    transition: opacity 120ms ease;
  }
  .sakura-petal.over-ui { opacity: 0.34; }
  .sakura-petal-drift {
    display: block; width: 100%; height: 100%;
    animation: sakura-sway var(--sway-duration) ease-in-out var(--sway-delay) infinite;
  }
  .sakura-petal-rotation {
    display: block; position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    animation: sakura-tumble var(--tumble-duration, 4.8s) linear var(--tumble-delay, 0s) infinite;
  }
  .sakura-petal-rotation > svg,
  .sakura-petal-rotation .petal-back svg {
    position: absolute; inset: 0; display: block; width: 100%; height: 100%;
    backface-visibility: hidden; overflow: visible;
  }
  .sakura-petal-rotation .petal-back {
    position: absolute; inset: 0; transform: rotateY(180deg);
    backface-visibility: hidden;
  }
  @keyframes sakura-fall {
    from { top: -12%; }
    to { top: 112%; }
  }
  @keyframes sakura-sway {
    0% { transform: translateX(0); }
    19% { transform: translateX(var(--sway-a)); }
    43% { transform: translateX(var(--sway-b)); }
    68% { transform: translateX(var(--sway-c)); }
    86% { transform: translateX(var(--sway-d)); }
    100% { transform: translateX(0); }
  }
  @keyframes sakura-tumble {
    0% { transform: rotateY(0deg) rotateZ(-20deg); }
    25% { transform: rotateY(90deg) rotateZ(10deg); }
    50% { transform: rotateY(180deg) rotateZ(20deg); }
    75% { transform: rotateY(270deg) rotateZ(-10deg); }
    100% { transform: rotateY(360deg) rotateZ(-20deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sakura-layer { display: none; }
  }
  
  /* 分类标题：居中完美对齐 */
  .category-header {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 0.9rem; flex-wrap: wrap;
  }
  .category-card.collapsed .category-header { margin-bottom: 0; }
  .category-name-pill {
    display: inline-flex; align-items: center;
    background: #8ba9d4; color: #ffffff;
    padding: 0;
    border-radius: 30px; font-size: 1.05rem; font-weight: 700;
    letter-spacing: 0.5px;
    transition: background 0.15s;
    box-shadow: 0 3px 8px rgba(108,143,199,0.25);
    max-width: 100%; word-break: break-word;
    min-height: 36px;
  }
  .category-name-pill::before {
    content: ''; width: 4px; height: 16px;
    background: #5a7db5; border-radius: 2px;
    margin-left: 10px; margin-right: 10px; flex-shrink: 0;
  }
  button.category-name-pill {
    color: #ffffff; cursor: pointer; font-family: inherit;
    font-size: 1.05rem; font-weight: 700;
  }
  .category-name-pill:hover { background: #7c9bc9; }
  .category-name-pill.uncategorized { background: #b8c5d8; cursor: pointer; }
  .category-name-pill.uncategorized::before { background: #9aabc2; }
  .category-name-pill.uncategorized:hover { background: #b8c5d8; }
  .category-name-input {
    flex: 0 1 auto; min-width: 4ch; max-width: calc(100% - 36px); height: 34px;
    padding: 0; border: 0; outline: 0; background: transparent;
    color: inherit; font: inherit; font-weight: 700; letter-spacing: inherit;
  }
  .category-name-input:focus { text-decoration: underline; text-decoration-thickness: 1px; }
  .category-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 36px; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%; background: transparent;
    color: inherit; cursor: pointer; transition: background 0.15s;
  }
  .category-toggle:hover { background: rgba(255,255,255,0.24); }
  .category-toggle svg { width: 16px; height: 16px; transition: transform 160ms ease; }
  .category-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .category-name-pill > .category-toggle { margin-left: 2px; }
  .category-toggle.category-name-pill {
    flex: 0 1 auto; width: auto; height: auto; gap: 0.15rem;
    padding-right: 0.35rem; border-radius: 30px; text-align: left;
  }
  .category-toggle.category-name-pill > svg { flex: 0 0 16px; }

  .category-count {
    font-size: 0.72rem; color: #9aabc2; font-weight: 600;
    background: #eef2f9; padding: 0.15rem 0.55rem; border-radius: 20px;
  }
  .category-actions {
    margin-left: auto; display: flex; gap: 0.15rem;
    opacity: 0; transition: opacity 0.15s;
  }
  .category-card:hover .category-actions { opacity: 1; }

  .icon-btn {
    background: transparent; border: none; font-size: 0.85rem;
    color: #a9b8ce; cursor: pointer; padding: 0;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; transition: 0.1s; font-family: inherit;
  }
  .icon-btn:hover { color: #4a6a94; background: #e8eff9; }
  .icon-btn.delete:hover { color: #d05252; background: #fbeaea; }

  /* ============ 歌曲列表 ============ */
  .song-list { list-style: none; padding: 0; margin: 0; }
  .song-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.55rem 0.3rem;
    border-bottom: 1px dashed #dde6f2;
    cursor: pointer; transition: background 0.12s; border-radius: 6px;
  }
  .song-item:last-child { border-bottom: none; }
  .song-item:hover { background: #f5f8fd; }
  .song-item:active { background: #e8eff9; }
  .song-number {
    font-size: 0.9rem; font-weight: 700; color: #8ba9d4;
    min-width: 1.6rem; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .song-title {
    flex: 1; font-size: 0.92rem; color: #2d3e5c;
    font-weight: 500; line-height: 1.4; word-break: break-word; min-width: 0;
  }
  .song-tags {
    display: flex; gap: 0.25rem; flex-wrap: wrap;
    flex-shrink: 0; justify-content: flex-end; max-width: 40%;
  }
  .tag-pill {
    display: inline-block; background: #eef2f9; color: #6c8fc7;
    padding: 0.15rem 0.6rem; border-radius: 20px;
    font-size: 0.7rem; font-weight: 600; white-space: nowrap;
  }
  .no-tag { color: #c5cfde; font-size: 0.7rem; font-style: italic; }
  .song-actions {
    display: flex; gap: 0.1rem; flex-shrink: 0;
    opacity: 1;
  }

  .empty-message {
    text-align: center;
    padding: 3rem 1rem; background: #ffffff;
    border-radius: 16px; color: #9aabc2;
    font-size: 0.9rem; border: 2px dashed #dde6f2;
    width: 100%; display: block;
  }
  .empty-message span {
    font-size: 1.8rem; display: block; margin-bottom: 0.6rem; opacity: 0.6;
  }

  .loading {
    text-align: center; padding: 3rem 1rem;
    color: #9aabc2; font-size: 0.9rem;
  }
  .loading .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #dde6f2; border-top-color: #6c8fc7;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 0.5rem; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 模态框 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(45,62,92,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 999; padding: 1rem; backdrop-filter: blur(2px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #ffffff; border-radius: 16px;
    padding: 1.4rem; max-width: 460px; width: 100%;
    box-shadow: 0 20px 50px rgba(45,62,92,0.3);
  }
  .modal h3 { font-size: 1rem; color: #3b5578; margin-bottom: 0.5rem; }
  .modal p {
    font-size: 0.82rem; color: #7a8ba8; margin-bottom: 0.8rem; line-height: 1.6;
  }
  .modal input {
    width: 100%; padding: 0 0.85rem; height: 36px;
    border: 1px solid #cdd9ea; border-radius: 8px;
    font-size: 0.82rem; outline: none; font-family: inherit;
    margin-bottom: 0.8rem;
  }
  .modal input:focus {
    border-color: #6c8fc7;
    box-shadow: 0 0 0 3px rgba(108,143,199,0.12);
  }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
  .modal a { color: #6c8fc7; text-decoration: none; }
  .modal a:hover { text-decoration: underline; }
  .modal code {
    background: #eef2f9; padding: 0.1rem 0.35rem;
    border-radius: 4px; font-size: 0.75rem; color: #4a6a94;
    word-break: break-all;
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #3b5578; color: #f5f8fd;
    padding: 0.6rem 1.4rem; border-radius: 40px;
    font-size: 0.82rem; font-weight: 500;
    box-shadow: 0 8px 24px rgba(59,85,120,0.3);
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 1000;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 可切换主题 ============ */
  body[data-theme="pink"] {
    --theme-page: #f8f0f3;
    --theme-text: #55404a;
    --theme-heading: #745263;
    --theme-primary: #bd7895;
    --theme-primary-dark: #a55f7d;
    --theme-primary-light: #d2a0b4;
    --theme-primary-mid: #c58aa3;
    --theme-primary-soft: #f2e3e9;
    --theme-primary-tint: #f7ebf0;
    --theme-primary-selected: #f0dce5;
    --theme-neutral: #e9dce2;
    --theme-border: #dfcbd4;
    --theme-border-soft: #e8dce2;
    --theme-border-dashed: #ddc4cf;
    --theme-secondary-text: #805d6e;
    --theme-muted: #a9919d;
    --theme-placeholder: #b9a5af;
    --theme-number: #bd7895;
    --theme-disabled: #d1c2ca;

    { id: 'pink', label: '粉色' },
    { id: 'gray', label: '灰色' },
    { id: 'blue', label: '蓝色' },
  ];

  // ---------- 状态 ----------
  let songs = [];
  let isAdmin = false;
  let currentSearch = '';
  let selectedTags = new Set();
  let lastCopiedTitle = '';
  let isTagFilterExpanded = false;
  const collapsedCategories = new Set();
  let editingId = null;
  let token = '';
  let isEditingTags = false;
  let filterTransitionTimer = 0;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const categoriesGrid = $('categoriesGrid');
  const statsDisplay = $('statsDisplay');
  const searchInput = $('searchInput');
  const goBtn = $('goBtn');
  const randomBtn = $('randomBtn');
  const toastEl = $('toast');
  const formPanel = $('formPanel');
  const formTitle = $('formTitle');
  const titleInput = $('titleInput');
  const tagsInput = $('tagsInput');
  const categoryInput = $('categoryInput');
  const saveBtn = $('saveBtn');
  const cancelBtn = $('cancelBtn');
  const tagFilterRow = $('tagFilterRow');
  const modeBadge = $('modeBadge');
  const avatarEntry = document.querySelector('.topbar-avatar');
  const themeToggleBtn = $('themeToggleBtn');
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  const loginModal = $('loginModal');
  const tokenInput = $('tokenInput');
  const loginOkBtn = $('loginOkBtn');
  const loginCancelBtn = $('loginCancelBtn');

  const categoryDropdownBtn = $('categoryDropdownBtn');
  const tagsDropdownBtn = $('tagsDropdownBtn');
  const categoryQuickPanel = $('categoryQuickPanel');
  const tagsQuickPanel = $('tagsQuickPanel');

  let currentTheme = 'pink';
  function setTheme(themeId, persist = false) {
    const theme = THEMES.find(item => item.id === themeId) || THEMES[0];
    currentTheme = theme.id;
    document.body.dataset.theme = theme.id;
    themeToggleBtn.dataset.theme = theme.id;
    themeToggleBtn.title = `当前主题：${theme.label}，点击切换`;
    themeToggleBtn.setAttribute('aria-label', themeToggleBtn.title);
    if (persist) localStorage.setItem(THEME_KEY, theme.id);
    const pageColor = getComputedStyle(document.body).getPropertyValue('--theme-page').trim();
    if (pageColor) themeColorMeta.setAttribute('content', pageColor);
  }

  // ============================================================
  // GitHub Gist API
  // ============================================================
  const GH_API = 'https://api.github.com';
  const isConfigured = () => CONFIG.GIST_ID && !CONFIG.GIST_ID.startsWith('PASTE');

  async function fetchGist() {
    const headers = { 'Accept': 'application/vnd.github+json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${GH_API}/gists/${CONFIG.GIST_ID}`, { headers });
    if (!res.ok) throw new Error(`读取失败: ${res.status}`);
    const data = await res.json();
    const file = data.files[CONFIG.FILE_NAME];
    if (!file) throw new Error(`Gist 里没有 ${CONFIG.FILE_NAME}`);
    let content = file.content;
    if (!content && file.raw_url) {
      content = await (await fetch(file.raw_url)).text();
    }
    return JSON.parse(content || '[]');
  }

  async function updateGist(newSongs) {
    const res = await fetch(`${GH_API}/gists/${CONFIG.GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        files: {
          [CONFIG.FILE_NAME]: {
            content: JSON.stringify(newSongs, null, 2),
          },
        },
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`写入失败 ${res.status}: ${err}`);
    }
  }

  // ============================================================
  // 工具
  // ============================================================
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function generateId() {
    return Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  }
  function escapeHtml(t) {
    if (!t) return '';
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function filterSongs(kw) {
    let list = songs;
    if (selectedTags.size > 0) {
      list = list.filter(s => (s.tags || []).some(t => selectedTags.has(t)));
    }
    if (kw && kw.trim() !== '') {
      const l = kw.trim().toLowerCase();
      list = list.filter(s =>
        s.title.toLowerCase().includes(l) ||
        (s.tags || []).some(t => t.toLowerCase().includes(l))
      );
    }
    return list;
  }
  function updateStats() {
    const total = songs.length;
    const filtered = filterSongs(currentSearch).length;
    const hasFilter = currentSearch.trim() !== '' || selectedTags.size > 0;
    statsDisplay.textContent = hasFilter ? `${filtered} / ${total} 首` : `${total} 首`;
  }

  function updateQuickPanels() {
    const cats = new Set();
    const tags = new Set();
    songs.forEach(s => {
      if (s.category && s.category.trim()) cats.add(s.category.trim());
      (s.tags || []).forEach(t => { if (t.trim()) tags.add(t.trim()); });
    });
    
    categoryQuickPanel.innerHTML = [...cats].map(c => `<div class="quick-item" data-val="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('');
    tagsQuickPanel.innerHTML = [...tags].map(t => `<div class="quick-item" data-val="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('');
  }

  // ============================================================
  // 标签筛选与编辑
  // ============================================================
  function renderTagFilter() {
    const tagCount = new Map();
    songs.forEach(s => (s.tags || []).forEach(t => {
      if (t) tagCount.set(t, (tagCount.get(t) || 0) + 1);
    }));
    if (tagCount.size === 0 && !isEditingTags) {
      tagFilterRow.innerHTML = '';
      isTagFilterExpanded = false;
      return;
    }
    
    const sorted = [...tagCount.entries()].sort((a, b) => b[1] - a[1]);
    let html = '';

    // 始终放在第一位的“编辑”按钮
    if (isAdmin) {
      if (isEditingTags) {
        html += `<button class="tag-filter edit-tag-btn editing" id="editTagsBtn">✅ 完成编辑</button>`;
      } else {
        html += `<button class="tag-filter edit-tag-btn" id="editTagsBtn">✏️ 编辑标签</button>`;
      }
    }

    if (isEditingTags) {
      // 编辑模式：显示输入框和打勾保存
      sorted.forEach(([tag]) => {
        html += `<div class="tag-edit-wrapper">
          <input type="text" class="tag-edit-input" value="${escapeHtml(tag)}" data-old="${escapeHtml(tag)}" title="回车保存">
          <button class="tag-save-btn" title="保存该标签" data-old="${escapeHtml(tag)}">✓</button>
        </div>`;
      });
    } else {
      // 正常模式：渲染标签药丸
      sorted.forEach(([tag, count]) => {
        const active = selectedTags.has(tag) ? 'active' : '';
        html += `<button class="tag-filter ${active}" data-tag="${escapeHtml(tag)}">
          ${escapeHtml(tag)}<span class="count">${count}</span>
        </button>`;
      });
    }
    
    tagFilterRow.innerHTML = `
      <div class="tag-filter-items">${html}</div>
      <button class="tag-filter tag-filter-toggle" type="button" aria-label="折叠筛选标签"
              title="折叠筛选标签" aria-expanded="false" hidden>折叠</button>`;
    updateTagFilterOverflow();
  }

  function updateTagFilterOverflow() {
    const items = tagFilterRow.querySelector('.tag-filter-items');
    const toggle = tagFilterRow.querySelector('.tag-filter-toggle');
    if (!items || !toggle) return;

    if (isEditingTags) {
      items.style.maxHeight = 'none';
      toggle.hidden = true;
      isTagFilterExpanded = false;
      return;
    }

    const collapsedHeight = parseFloat(getComputedStyle(document.documentElement).fontSize) * 1.8;
    const hasOverflow = items.scrollHeight > collapsedHeight + 1;
    toggle.hidden = !hasOverflow;
    if (!hasOverflow) isTagFilterExpanded = false;
    items.style.maxHeight = isTagFilterExpanded ? `${items.scrollHeight}px` : `${collapsedHeight}px`;
    toggle.setAttribute('aria-expanded', String(isTagFilterExpanded));
    const label = isTagFilterExpanded ? '收起' : '折叠';
    toggle.textContent = label;
    toggle.setAttribute('aria-label', `${label}筛选标签`);
    toggle.title = `${label}筛选标签`;
  }

  async function saveSingleTag(oldTag, newTag) {
    if (!newTag || oldTag === newTag) return false;
    const newSongs = songs.map(s => {
      if (!s.tags || !s.tags.includes(oldTag)) return s;
      const newTags = [...new Set(s.tags.map(t => t === oldTag ? newTag : t))];
      return { ...s, tags: newTags };
    });
    return await saveToGist(newSongs, `✏️ 已将标签「${oldTag}」改为「${newTag}」`);
  }

  // ============================================================
  // 渲染分类与歌曲
  // ============================================================
  function render(animateFilter = false) {
    const filtered = filterSongs(currentSearch);

    if (filtered.length === 0) {
      categoriesGrid.innerHTML = `
        <div class="empty-message">
          <span>🎵</span>
          ${songs.length === 0 ? '还没有歌曲' : '没有找到匹配的歌曲'}
        </div>
      `;
      if (animateFilter) animateFilteredResults();
      updateStats();
      return;
    }

    const groups = new Map();
    filtered.forEach(song => {
      const cat = (song.category && song.category.trim()) ? song.category.trim() : UNCATEGORIZED;
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(song);
    });

    const sortedCats = [...groups.keys()].sort((a, b) => {
      if (a === UNCATEGORIZED) return 1;
      if (b === UNCATEGORIZED) return -1;
      return a.localeCompare(b, 'zh-Hans-CN');
    });

    let html = '';
    sortedCats.forEach((cat, index) => {
      const list = groups.get(cat);
      const isUncat = cat === UNCATEGORIZED;
      const isCollapsed = collapsedCategories.has(cat);
      const listId = `song-list-${index}`;
      const catActions = isAdmin ? `
        <div class="category-actions">
          <button class="icon-btn add-to-cat" data-category="${escapeHtml(cat)}" title="在此分类添加">＋</button>
          ${isUncat ? '' : `<button class="icon-btn delete-cat" data-category="${escapeHtml(cat)}" title="删除整个分类">🗑</button>`}
        </div>` : '';

      const categoryControl = isAdmin && !isUncat
        ? `<div class="category-name-pill" data-category="${escapeHtml(cat)}">
             <input class="category-name-input" type="text" style="width:${measureCategoryName(cat)}px"
                    value="${escapeHtml(cat)}"
                    aria-label="编辑分类名「${escapeHtml(cat)}」" data-original="${escapeHtml(cat)}">
             ${renderCategoryToggle(cat, listId, isCollapsed)}
           </div>`
        : `<button class="category-name-pill category-toggle${isUncat ? ' uncategorized' : ''}" type="button"
                  data-category="${escapeHtml(cat)}" aria-expanded="${!isCollapsed}"
                  aria-controls="${listId}" aria-label="${isCollapsed ? '展开' : '折叠'}「${escapeHtml(cat)}」歌单"
                  title="${isCollapsed ? '展开歌单' : '折叠歌单'}">
             <span>${escapeHtml(cat)}</span>
             <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
               <path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
           </button>`;

      html += `
        <div class="category-card${isCollapsed ? ' collapsed' : ''}" data-category="${escapeHtml(cat)}">
          <div class="category-header">
            ${categoryControl}
            <span class="category-count">${list.length}</span>
            ${catActions}
          </div>
          <ul class="song-list" id="${listId}"${isCollapsed ? ' hidden' : ''}>
            ${list.map((s, i) => renderItem(s, i + 1)).join('')}
          </ul>
        </div>
      `;
    });

    categoriesGrid.innerHTML = html;
    if (animateFilter) animateFilteredResults();
    updateStats();
  }

  function renderSakuraPetals() {
    const petalArtwork = fill => `<svg viewBox="0 0 24 44" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path d="M12 42C8.4 37 3.1 29.5 2.6 20.2 2.1 12 4.8 5.4 9.2 4.8c1.5-.2 2.5 1.7 2.8 4.3.5-2.7 1.5-4.4 3.1-4.2 4.5.2 6.9 6.8 6.3 15.3C20.8 29.5 15.7 37 12 42Z" fill="${fill}" stroke="var(--theme-primary)" stroke-opacity=".4" stroke-width=".65" stroke-linejoin="round"/>
      <path d="M12 39C11.2 31 11.3 19 12 9.2M11.6 30.5 6.1 22M11.8 25.1l6-8.3M11.6 34l-3.2-4.9" fill="none" stroke="var(--theme-primary)" stroke-opacity=".35" stroke-width=".6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.4 11.2c.8-2.5 2-3.6 3.4-3.8" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width=".8" stroke-linecap="round"/>
    </svg>`;
    const front = petalArtwork('currentColor');
    const back = petalArtwork('var(--theme-primary-light)');
    const randomBetween = (min, max) => min + Math.random() * (max - min);
    const petalCount = 16;
    const fallDuration = window.innerHeight * 1.24 / 28;
    const renderPetal = index => {
      const offsets = Array.from({ length: 4 }, () => Math.round(randomBetween(-56, 56)));
      const duration = randomBetween(3.6, 7.2).toFixed(2);
      const delay = (-randomBetween(0, Number(duration))).toFixed(2);
      const tumbleDuration = randomBetween(3.4, 6.4).toFixed(2);
      const tumbleDelay = (-randomBetween(0, Number(tumbleDuration))).toFixed(2);
      const fallPhase = (fallDuration * index / petalCount + randomBetween(0, 0.45)) % fallDuration;
      const style = [
        `--petal-left:${randomBetween(0, 100).toFixed(2)}%`,
        `--sway-a:${offsets[0]}px`,
        `--sway-b:${offsets[1]}px`,
        `--sway-c:${offsets[2]}px`,
        `--sway-d:${offsets[3]}px`,
        `--sway-duration:${duration}s`,
        `--sway-delay:${delay}s`,
        `--tumble-duration:${tumbleDuration}s`,
        `--tumble-delay:${tumbleDelay}s`,
        `--fall-delay:${(-fallPhase).toFixed(2)}s`,
      ].join(';');
      return `<span class="sakura-petal" style="${style}"><span class="sakura-petal-drift"><span class="sakura-petal-rotation">${front}<span class="petal-back">${back}</span></span></span></span>`;
    };
    return Array.from({ length: petalCount }, (_, index) => renderPetal(index)).join('');
  }

  function initSakuraBackground() {
    const background = $('sakuraBackground');
    const setFallDuration = () => {
      background.style.setProperty('--sakura-duration', `${window.innerHeight * 1.24 / 28}s`);
    };
    setFallDuration();
    background.innerHTML = renderSakuraPetals();
    const uiSelector = '.topbar, .form-panel.show, .search-row, .tag-filter-row, .category-card, .go-fab, .toast.show';
    const updatePetalOpacity = () => {
      background.querySelectorAll('.sakura-petal').forEach(petal => {
        const bounds = petal.getBoundingClientRect();
        const samplePoints = [
          [bounds.left + bounds.width / 2, bounds.top + bounds.height / 2],
          [bounds.left + 3, bounds.top + bounds.height / 2],
          [bounds.right - 3, bounds.top + bounds.height / 2],
        ];
        const overlapsUI = samplePoints.some(([x, y]) => {
          const element = document.elementFromPoint(x, y);
          return element?.closest(uiSelector);
        });
        petal.classList.toggle('over-ui', Boolean(overlapsUI));
      });
    };
    updatePetalOpacity();
    window.setInterval(updatePetalOpacity, 100);
    window.addEventListener('resize', setFallDuration);
  }

  function renderCategoryToggle(category, listId, isCollapsed) {
    return `<button class="category-toggle" type="button"
                    data-category="${escapeHtml(category)}"
                    aria-expanded="${!isCollapsed}" aria-controls="${listId}"
                    aria-label="${isCollapsed ? '展开' : '折叠'}「${escapeHtml(category)}」歌单"
                    title="${isCollapsed ? '展开歌单' : '折叠歌单'}">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>`;
  }

  function measureCategoryName(name) {
    const context = document.createElement('canvas').getContext('2d');
    if (!context) return Math.ceil(name.length * 18);
    const fontSize = parseFloat(getComputedStyle(document.documentElement).fontSize) * 1.05;
    context.font = `700 ${fontSize}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    return Math.ceil(context.measureText(name).width + name.length * 0.5 + 4);
  }

  function animateFilteredResults() {
    clearTimeout(filterTransitionTimer);
    categoriesGrid.classList.remove('filter-transition');
    void categoriesGrid.offsetWidth;
    categoriesGrid.classList.add('filter-transition');
    filterTransitionTimer = setTimeout(() => {
      categoriesGrid.classList.remove('filter-transition');
    }, 220);
  }

  const categoryListAnimations = new WeakMap();
  function animateCategoryList(list, expand) {
    const currentHeight = list.getBoundingClientRect().height;
    const previousAnimation = categoryListAnimations.get(list);
    if (previousAnimation) {
      categoryListAnimations.delete(list);
      previousAnimation.cancel();
    }

    list.hidden = false;
    list.style.height = `${currentHeight}px`;
    list.style.overflow = 'hidden';
    const targetHeight = expand ? list.scrollHeight : 0;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduceMotion ? 0 : 280;
    const animation = list.animate(
      [{ height: `${currentHeight}px` }, { height: `${targetHeight}px` }],
      { duration, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
    );
    categoryListAnimations.set(list, animation);

    const finish = () => {
      if (categoryListAnimations.get(list) !== animation) return;
      list.hidden = !expand;
      list.style.height = '';
      list.style.overflow = '';
      categoryListAnimations.delete(list);
    };
    animation.onfinish = finish;
    animation.oncancel = finish;
  }

  function renderItem(song, num) {
    const tagsHtml = (song.tags && song.tags.length > 0)
      ? song.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')
      : `<span class="no-tag">无标签</span>`;

    const actions = isAdmin ? `
      <span class="song-actions">
        <button class="icon-btn delete" data-id="${song.id}" title="删除">✕</button>
      </span>` : '';

    return `
      <li class="song-item" data-id="${song.id}" data-title="${escapeHtml(song.title)}">
        <span class="song-number">${num}.</span>
        <span class="song-title">${escapeHtml(song.title)}</span>
        <span class="song-tags">${tagsHtml}</span>
        ${actions}
      </li>
    `;
  }

  // ============================================================
  // 复制与随机
  // ============================================================
  function copyTitle(t) {
    lastCopiedTitle = t;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t)
        .then(() => showToast(`已复制: ${t.length > 30 ? t.slice(0, 30) + '…' : t}`))
        .catch(() => fallbackCopy(t));
    } else fallbackCopy(t);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try {
      document.execCommand('copy')
        ? showToast(`已复制: ${text.length > 30 ? text.slice(0,30)+'…' : text}`)
        : showToast('❌ 复制失败');
    } catch { showToast('❌ 复制失败'); }
    document.body.removeChild(ta);
  }

  function randomCopy() {
    let pool = filterSongs(currentSearch);
    // 过滤掉分类为“还没学会”的
    pool = pool.filter(s => {
      const cat = (s.category && s.category.trim()) ? s.category.trim() : UNCATEGORIZED;
      return cat !== '还没学会';
    });
    // 过滤掉标签里包含“还没学会”的
    pool = pool.filter(s => !(s.tags || []).includes('还没学会'));

    if (pool.length === 0) { 
      showToast('🎲 当前没有可随机的歌曲（已排除“还没学会”）'); 
      return; 
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    copyTitle(pick.title);
  }

  function searchLastCopiedTitle() {
    if (!lastCopiedTitle) {
      showToast('请先选一首歌');
      return;
    }
    const query = `${lastCopiedTitle} 卡拉ok`;
    const encodedQuery = encodeURIComponent(query);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobile = isAndroid || isIOS;
    const fallbackUrl = isMobile
      ? `https://m.bilibili.com/search?keyword=${encodedQuery}`
      : `https://search.bilibili.com/all?keyword=${encodedQuery}`;
    const searchTab = window.open('about:blank', '_blank');
    if (!searchTab) {
      showToast('浏览器阻止了新标签页，请允许弹出窗口后重试');
      return;
    }
    searchTab.opener = null;

    if (isAndroid) {
      searchTab.location.replace(
        `intent://search?keyword=${encodedQuery}#Intent;scheme=bilibili;package=tv.danmaku.bili;S.browser_fallback_url=${encodeURIComponent(fallbackUrl)};end`
      );
    } else if (isIOS) {
      searchTab.location.replace(`bilibili://search?keyword=${encodedQuery}`);
      window.setTimeout(() => {
        if (!searchTab.closed) searchTab.location.replace(fallbackUrl);
      }, 1500);
    } else {
      searchTab.location.replace(fallbackUrl);
    }
  }

  async function saveToGist(newSongs, successMsg) {
    if (!token) { showToast('⚠️ 请先登录管理模式'); return false; }
    if (!isConfigured()) { showToast('⚠️ 请先在代码里配置 GIST_ID'); return false; }
    try {
      showToast('⏳ 正在同步到 Gist...');
      await updateGist(newSongs);
      songs = newSongs;
      updateQuickPanels();
      renderTagFilter();
      render();
      showToast(successMsg || '✅ 已同步');
      return true;
    } catch (e) {
      console.error(e);
      showToast(`❌ ${e.message}`);
      return false;
    }
  }

  // ============================================================
  // 表单操作
  // ============================================================
  function resetForm() {
    editingId = null;
    formTitle.textContent = '添加新歌';
    titleInput.value = '';
    tagsInput.value = '';
    categoryInput.value = '';
    titleInput.classList.remove('duplicate');
    cancelBtn.style.display = 'none';
    saveBtn.textContent = '保存';
  }
  function openEditForm(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;
    editingId = id;
    formTitle.textContent = '编辑歌曲';
    titleInput.value = song.title;
    tagsInput.value = (song.tags || []).join(', ');
    categoryInput.value = song.category || '';
    titleInput.classList.remove('duplicate');
    cancelBtn.style.display = 'inline-flex';
    saveBtn.textContent = '更新';
    titleInput.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function isDuplicateTitle(title) {
    const normalized = title.trim().toLowerCase();
    return songs.some(s => {
      if (editingId && s.id === editingId) return false;
      return s.title.trim().toLowerCase() === normalized;
    });
  }

  async function saveForm() {
    const title = titleInput.value.trim();
    if (!title) {
      showToast('⚠️ 歌名不能为空');
      titleInput.focus();
      return;
    }

    if (isDuplicateTitle(title)) {
      titleInput.classList.add('duplicate');
      showToast(`⚠️ 《${title}》已经存在，不能重复添加`);
      titleInput.focus();
      titleInput.select();
      return;
    }
    titleInput.classList.remove('duplicate');

    const tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
    const category = categoryInput.value.trim();

    let newSongs;
    if (editingId) {
      newSongs = songs.map(s => s.id === editingId ? { ...s, title, tags, category } : s);
    } else {
      newSongs = [...songs, { id: generateId(), title, tags, category }];
    }

    const ok = await saveToGist(newSongs, editingId ? `✏️ 已更新《${title}》` : `🎵 已添加《${title}》`);
    if (ok) {
      resetForm();
      if (currentSearch.trim() !== '') { searchInput.value = ''; currentSearch = ''; }
    }
  }

  titleInput.addEventListener('input', () => {
    const title = titleInput.value.trim();
    if (title && isDuplicateTitle(title)) {
      titleInput.classList.add('duplicate');
    } else {
      titleInput.classList.remove('duplicate');
    }
  });

  async function deleteSong(id) {
    const s = songs.find(x => x.id === id);
    if (!s) return;
    if (!confirm(`确定删除《${s.title}》吗？`)) return;
    await saveToGist(songs.filter(x => x.id !== id), `🗑️ 已删除《${s.title}》`);
  }

  async function deleteCategory(cat) {
    const list = songs.filter(s => {
      const c = (s.category && s.category.trim()) ? s.category.trim() : UNCATEGORIZED;
      return c === cat;
    });
    if (list.length === 0) return;
    if (!confirm(`确定删除分类「${cat}」及其中 ${list.length} 首歌吗？`)) return;
    const newSongs = songs.filter(s => {
      const c = (s.category && s.category.trim()) ? s.category.trim() : UNCATEGORIZED;
      return c !== cat;
    });
    await saveToGist(newSongs, `🗑️ 已删除分类「${cat}」`);
  }

  async function saveCategoryName(input) {
    if (!isAdmin || !input.isConnected) return;
    const oldName = input.dataset.original;
    const newName = input.value.trim();
    if (!newName || newName === oldName) {
      input.value = oldName;
      return;
    }

    const newSongs = songs.map(song => {
      const category = (song.category && song.category.trim()) ? song.category.trim() : UNCATEGORIZED;
      return category === oldName ? { ...song, category: newName } : song;
    });
    const wasCollapsed = collapsedCategories.has(oldName);
    const targetWasCollapsed = collapsedCategories.has(newName);
    collapsedCategories.delete(oldName);
    if (wasCollapsed || targetWasCollapsed) collapsedCategories.add(newName);
    const ok = await saveToGist(newSongs, `✏️ 分类已改为「${newName}」`);
    if (!ok) {
      collapsedCategories.delete(newName);
      if (wasCollapsed) collapsedCategories.add(oldName);
      if (targetWasCollapsed) collapsedCategories.add(newName);
      if (input.isConnected) input.value = oldName;
    }
  }

  // ============================================================
  // 登录 / 退出
  // ============================================================
  function setAdminUI(admin) {
    isAdmin = admin;
    if (admin) {
      modeBadge.textContent = '🔓 管理';
      modeBadge.className = 'mode-badge admin';
      avatarEntry.setAttribute('aria-label', '退出管理模式');
      avatarEntry.title = '点击退出管理模式；右键可彻底登出';
      formPanel.classList.add('show');
    } else {
      modeBadge.textContent = '👁️ 访客';
      modeBadge.className = 'mode-badge guest';
      avatarEntry.setAttribute('aria-label', '进入管理模式');
      avatarEntry.title = '点击头像进入管理模式';
      formPanel.classList.remove('show');
      resetForm();
    }
    renderTagFilter();
    render();
  }

  async function login() {
    const t = tokenInput.value.trim();
    if (!t) { showToast('⚠️ 请输入 Token'); return; }
    if (!isConfigured()) { showToast('⚠️ 请先在代码里配置 GIST_ID'); return; }

    try {
      showToast('⏳ 验证中...');
      token = t;
      const latestSongs = await fetchGist();
      localStorage.setItem(TOKEN_KEY, t);
      loginModal.classList.remove('show');
      tokenInput.value = '';
      songs = latestSongs;
      updateQuickPanels();
      setAdminUI(true);
      showToast(`🔓 已进入管理模式（${songs.length} 首）`);
    } catch (e) {
      token = '';
      console.error(e);
      showToast(`❌ Token 无效或无权限`);
    }
  }

  function logout() {
    setAdminUI(false);
    showToast('👋 已切到访客视角（Token 已记住）');
  }

  async function openLogin() {
    const savedToken = localStorage.getItem(TOKEN_KEY);
    if (savedToken && isConfigured()) {
      try {
        showToast('⏳ 正在用已保存的 Token 登录...');
        token = savedToken;
        const latestSongs = await fetchGist();
        songs = latestSongs;
        updateQuickPanels();
        setAdminUI(true);
        showToast(`🔓 欢迎回来（${songs.length} 首）`);
        return;
      } catch (e) {
        console.warn('保存的 Token 已失效', e);
        token = '';
        localStorage.removeItem(TOKEN_KEY);
        showToast('⚠️ 保存的 Token 已失效，请重新输入');
      }
    }
    loginModal.classList.add('show');
    tokenInput.focus();
  }

  // ============================================================
  // 初始加载
  // ============================================================
  async function loadInitialData() {
    categoriesGrid.innerHTML = '<div class="loading"><span class="spinner"></span>正在加载歌单...</div>';

    if (!isConfigured()) {
      categoriesGrid.innerHTML = `
        <div class="empty-message">
          <span>⚙️</span>
          请先打开 index.html，把顶部 CONFIG.GIST_ID 改成你的 Gist ID
        </div>`;
      return;
    }

    try {
      songs = await fetchGist();
      updateQuickPanels();
      renderTagFilter();
      render();
    } catch (e) {
      console.error(e);
      categoriesGrid.innerHTML = `
        <div class="empty-message">
          <span>⚠️</span>
          加载失败：${escapeHtml(e.message)}
        </div>`;
    }
  }

  // ============================================================
  // 事件绑定
  // ============================================================
  function bindEvents() {
    // 搜索
    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value;
      render();
    });
    goBtn.addEventListener('click', searchLastCopiedTitle);
    randomBtn.addEventListener('click', randomCopy);

    // 标签筛选栏
    tagFilterRow.addEventListener('click', async e => {
      const toggle = e.target.closest('.tag-filter-toggle');
      if (toggle) {
        isTagFilterExpanded = !isTagFilterExpanded;
        updateTagFilterOverflow();
        return;
      }

      // 点击“编辑标签/完成编辑”按钮
      if (e.target.closest('#editTagsBtn')) {
        isEditingTags = !isEditingTags;
        renderTagFilter();
        return;
      }

      // 点击小对勾保存修改
      const saveBtn = e.target.closest('.tag-save-btn');
      if (saveBtn) {
        const oldTag = saveBtn.dataset.old;
        const wrapper = saveBtn.closest('.tag-edit-wrapper');
        const input = wrapper.querySelector('.tag-edit-input');
        const newTag = input.value.trim();
        
        if (!newTag) { showToast('⚠️ 标签不能为空'); return; }
        const ok = await saveSingleTag(oldTag, newTag);
        if (ok) {
          isEditingTags = false;
          renderTagFilter();
        }
        return;
      }

      // 点击正常的标签药丸进行筛选
      const btn = e.target.closest('.tag-filter');
      if (!btn || btn.classList.contains('edit-tag-btn')) return;
      const tag = btn.dataset.tag;
      if (selectedTags.has(tag)) selectedTags.delete(tag);
      else selectedTags.add(tag);
      renderTagFilter();
      render(true);
    });
    window.addEventListener('resize', updateTagFilterOverflow);

    // 标签编辑框内按回车保存
    tagFilterRow.addEventListener('keydown', e => {
      if (e.target.classList.contains('tag-edit-input') && e.key === 'Enter') {
        e.preventDefault();
        const wrapper = e.target.closest('.tag-edit-wrapper');
        const saveBtn = wrapper.querySelector('.tag-save-btn');
        if (saveBtn) saveBtn.click();
      }
    });

    // 表单保存
    saveBtn.addEventListener('click', saveForm);
    cancelBtn.addEventListener('click', resetForm);
    [titleInput, tagsInput, categoryInput].forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveForm(); }
      });
    });

    // 头像作为隐藏管理入口
    avatarEntry.setAttribute('role', 'button');
    avatarEntry.tabIndex = 0;
    avatarEntry.addEventListener('click', () => {
      if (isAdmin) logout();
      else openLogin();
    });
    avatarEntry.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (isAdmin) logout();
        else openLogin();
      }
    });

    // 右键彻底登出
    avatarEntry.addEventListener('contextmenu', (e) => {
      if (isAdmin) {
        e.preventDefault();
        if (confirm('彻底登出？将清除本地保存的 Token，下次需要重新输入。')) {
          token = '';
          localStorage.removeItem(TOKEN_KEY);
          setAdminUI(false);
          showToast('🔒 已彻底登出，Token 已清除');
        }
      }
    });

    themeToggleBtn.addEventListener('click', () => {
      const currentIndex = THEMES.findIndex(theme => theme.id === currentTheme);
      const nextTheme = THEMES[(currentIndex + 1) % THEMES.length];
      setTheme(nextTheme.id, true);
    });

    // 登录框事件
    loginOkBtn.addEventListener('click', login);
    loginCancelBtn.addEventListener('click', () => {
      loginModal.classList.remove('show');
      tokenInput.value = '';
    });
    tokenInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); login(); }
    });

    // 快捷选择面板
    categoryDropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isShowing = categoryQuickPanel.classList.contains('show');
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      if (!isShowing) categoryQuickPanel.classList.add('show');
    });
    tagsDropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isShowing = tagsQuickPanel.classList.contains('show');
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      if (!isShowing) tagsQuickPanel.classList.add('show');
    });
    
    categoryQuickPanel.addEventListener('click', e => {
      if (e.target.classList.contains('quick-item')) {
        categoryInput.value = e.target.dataset.val;
        categoryQuickPanel.classList.remove('show');
      }
    });
    
    tagsQuickPanel.addEventListener('click', e => {
      if (e.target.classList.contains('quick-item')) {
        const current = tagsInput.value.trim();
        const newVal = e.target.dataset.val;
        if (current) {
          const arr = current.split(',').map(s => s.trim()).filter(Boolean);
          if (!arr.includes(newVal)) {
            tagsInput.value = [...arr, newVal].join(', ') + ', ';
          }
        } else {
          tagsInput.value = newVal + ', ';
        }
        tagsQuickPanel.classList.remove('show');
        tagsInput.focus();
      }
    });

    // 点击其他区域关闭快捷面板
    document.addEventListener('click', () => {
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
    });

    // 分类区域点击委托
    categoriesGrid.addEventListener('click', e => {
      // 折叠或展开分类歌单
      const toggle = e.target.closest('.category-toggle');
      if (toggle) {
        const category = toggle.dataset.category;
        const isCollapsed = collapsedCategories.has(category);
        const card = toggle.closest('.category-card');
        const list = card.querySelector('.song-list');
        if (isCollapsed) collapsedCategories.delete(category);
        else collapsedCategories.add(category);
        animateCategoryList(list, isCollapsed);
        card.classList.toggle('collapsed', !isCollapsed);
        toggle.setAttribute('aria-expanded', String(isCollapsed));
        toggle.setAttribute('aria-label', `${isCollapsed ? '折叠' : '展开'}「${category}」歌单`);
        toggle.title = isCollapsed ? '折叠歌单' : '展开歌单';
        return;
      }

      // 在指定分类下添加
      const addToCat = e.target.closest('.add-to-cat');
      if (addToCat) {
        e.stopPropagation();
        categoryInput.value = addToCat.dataset.category === UNCATEGORIZED ? '' : addToCat.dataset.category;
        titleInput.value = '';
        tagsInput.value = '';
        titleInput.classList.remove('duplicate');
        titleInput.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      
      // 删除整个分类
      const delCat = e.target.closest('.delete-cat');
      if (delCat) { e.stopPropagation(); deleteCategory(delCat.dataset.category); return; }
      
      // 删除单曲
      const delBtn = e.target.closest('.icon-btn.delete');
      if (delBtn) { e.stopPropagation(); deleteSong(delBtn.dataset.id); return; }

      // 管理模式点击歌曲进行编辑，访客模式点击歌曲复制歌名
      const item = e.target.closest('.song-item');
      if (item) {
        if (isAdmin) {
          openEditForm(item.dataset.id);
        } else {
          const t = item.dataset.title;
          if (t) copyTitle(t);
        }
      }
    });

    categoriesGrid.addEventListener('focusout', e => {
      if (e.target.matches('.category-name-input')) {
        setTimeout(() => saveCategoryName(e.target), 0);
      }
    });
    categoriesGrid.addEventListener('keydown', e => {
      if (!e.target.matches('.category-name-input')) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.target.value = e.target.dataset.original;
        e.target.blur();
      }
    });

    categoriesGrid.addEventListener('mousedown', e => {
      if (e.target.closest('.icon-btn, .category-name-pill')) e.stopPropagation();
    });
  }

  // ============================================================
  // 启动
  // ============================================================
  async function init() {
    initSakuraBackground();
    bindEvents();
    setAdminUI(false);
    await loadInitialData();
  }

  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.type = 'image/jpeg';
  favicon.href = document.querySelector('.topbar-avatar').src;
  document.head.appendChild(favicon);

  // Service Worker 只在 http(s) 下注册（file:// 打开时不支持），是安装成 WebAPK 的必要条件
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.warn('Service Worker 注册失败：', err);
      });
    });
  }

  setTheme(localStorage.getItem(THEME_KEY));
  init();
})();
</script>
</body>
</html>
